<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Badge Icons</title>
<style>
  :root {
    --page: #e9e9ec; --card: #fff; --panel: #ececec; --fg: #111; --fg-2: #656565; --fg-3: #979797;
    --glass: #fff; --info: #1f8ae6; --info-text: #1574c9; --ok: #2f9e5f; --ok-text: #24804c; --chip: #f2f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #161618; --card: #1f1f22; --panel: #2a2a2e; --fg: #f2f2f3; --fg-2: #a6a6ab; --fg-3: #7b7b80;
      --glass: #3a3a3f; --info-text: #5eb0ff; --ok-text: #5fd391; --chip: #2a2a2e; }
  }
  :root[data-theme="dark"] { --page: #161618; --card: #1f1f22; --panel: #2a2a2e; --fg: #f2f2f3; --fg-2: #a6a6ab; --fg-3: #7b7b80;
    --glass: #3a3a3f; --info-text: #5eb0ff; --ok-text: #5fd391; --chip: #2a2a2e; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13px; background: var(--page);
    color: var(--fg); padding: 32px 16px 56px; -webkit-font-smoothing: antialiased; }
  header { max-width: 1100px; margin: 0 auto 20px; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin-top: 6px; color: var(--fg-2); max-width: 760px; line-height: 1.45; }
  .grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
  .opt { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.07); }
  .opt h2 { font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .rec { font-size: 10px; font-weight: 600; color: #fff; background: var(--info); padding: 1px 7px; border-radius: 99px; }
  .opt p { margin-top: 4px; color: var(--fg-2); font-size: 12px; line-height: 1.45; min-height: 52px; }
  .opt .lu { margin-top: 6px; font-family: "SF Mono", Menlo, monospace; font-size: 10.5px; color: var(--fg-3); }
  .states { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .state { background: var(--panel); border-radius: 12px; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .state .lab { font-size: 10.5px; color: var(--fg-3); }
  .zoom { width: 64px; height: 64px; border-radius: 16px; background: var(--glass); display: grid; place-items: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), inset 0 0 0 .5px rgba(0,0,0,.08); }
  .zoom .ic { transform: scale(2.6); }

  .gbtn { height: 32px; display: inline-flex; align-items: center; gap: 7px; padding: 0 11px 0 13px; border-radius: 99px; background: var(--glass);
    box-shadow: 0 1px 2px rgba(0,0,0,.08), inset 0 0 0 .5px rgba(0,0,0,.08); font-size: 13.5px; color: var(--fg); white-space: nowrap; }
  .ic { position: relative; display: inline-flex; width: 15px; height: 15px; }
  .ic > svg { width: 15px; height: 15px; }
  .ic.info > svg { color: var(--info-text); }
  .ic.ok > svg { color: var(--ok-text); }
  .ic.plain > svg { color: var(--fg); }
  .b { position: absolute; top: -5px; right: -7px; width: 12px; height: 12px; border-radius: 99px; display: grid; place-items: center;
    box-shadow: 0 0 0 1.5px var(--glass); }
  .b.br { top: auto; bottom: -5px; }
  .b.info { background: var(--info); } .b.ok { background: var(--ok); }
  .b svg { width: 8px; height: 8px; color: #fff; }
  .b svg.fill { fill: #fff; stroke: none; width: 8px; height: 8px; }
  .disc { width: 15px; height: 15px; border-radius: 99px; display: grid; place-items: center; }
  .disc.info { background: var(--info); } .disc.ok { background: var(--ok); }
  .disc svg { width: 10px; height: 10px; color: #fff; }

  .ref { max-width: 1100px; margin: 0 auto 18px; display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: 14px; padding: 12px 16px; font-size: 12px; color: var(--fg-2); flex-wrap: wrap; }
  .ref b { color: var(--fg); }
</style>
</head>
<body>
<header>
  <h1>Settings badge icons</h1>
  <p>The gear stays as it is. A 12px badge sits on its top-right corner, ringed in the button colour like the usage-reset badge. It's blue while an update is available and green once it's downloaded. Each card shows the button at real size and at 2.6× zoom.</p>
</header>
<div class="ref" id="ref"></div>
<div class="grid" id="place" style="margin-bottom:28px"></div>
<div class="grid" id="grid"></div>

<script>
const svg = (d, sw = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const P = {
  gear: '<path d="M9.67 4.14a2 2 0 0 1 4.66 0 2 2 0 0 0 2.98 1.24 2 2 0 0 1 3.3 3.3 2 2 0 0 0 1.24 2.98 2 2 0 0 1 0 4.66 2 2 0 0 0-1.24 2.98 2 2 0 0 1-3.3 3.3 2 2 0 0 0-2.98 1.24 2 2 0 0 1-4.66 0 2 2 0 0 0-2.98-1.24 2 2 0 0 1-3.3-3.3 2 2 0 0 0-1.24-2.98 2 2 0 0 1 0-4.66 2 2 0 0 0 1.24-2.98 2 2 0 0 1 3.3-3.3 2 2 0 0 0 2.98-1.24"/><circle cx="12" cy="12" r="3"/>',
  ticket: '<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>',
  package: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/>',
  packageCheck: '<path d="m16 16 2 2 4-4"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m7.5 4.27 9 5.15"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/>',
  sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>',
  download: '<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>',
  rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
  star: '<path d="M12 1.5c.6 4.9 2.6 7.5 10.5 10.5-7.9 3-9.9 5.6-10.5 10.5C11.4 17.6 9.4 15 1.5 12 9.4 9 11.4 6.4 12 1.5z"/>',
  tray: '<path d="M12 3v10"/><path d="m7.5 9 4.5 4.5L16.5 9"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
  arrowUpLine: '<path d="M5 4h14"/><path d="M12 20V9"/><path d="m6.5 13.5 5.5-5.5 5.5 5.5"/>',
  rotate: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  up: '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',
  down: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
};
const icon = (tone, badge, fill, pos = "") =>
  `<span class="ic plain">${svg(P.gear)}<span class="b ${tone} ${pos}">${fill ? `<svg class="fill" viewBox="0 0 24 24">${P[badge]}</svg>` : svg(P[badge], 3.4)}</span></span>`;
const disc = (glyph, tone) => `<span class="ic"><span class="disc ${tone}">${svg(P[glyph], 3)}</span></span>`;
const btn = (ic) => `<span class="gbtn">Settings${ic}</span>`;
const state = (lab, ic) => `<div class="state"><span class="lab">${lab}</span><div class="zoom">${ic}</div>${btn(ic)}</div>`;

document.getElementById("ref").innerHTML =
  `<b>For reference:</b> today's button ${btn(`<span class="ic plain">${svg(P.gear)}</span>`)}. The gear stays, and only the badge changes.`;

const opts = [
  { t: "Download → Restart", rec: true, lu: "badge: tray-arrow → rotate-ccw",
    d: "A download-tray glyph while there's something to fetch, then a restart arrow once it's downloaded. Each state shows what to do next.",
    a: icon("info", "tray"), r: icon("ok", "rotate") },
  { t: "Sparkle → Restart", lu: "badge: 4-point sparkle (filled) → rotate-ccw",
    d: "A filled sparkle for “something new”. Friendly, it reads well at 12px, and it can't be mistaken for an error.",
    a: icon("info", "star", true), r: icon("ok", "rotate") },
  { t: "Arrow up → Check", lu: "badge: arrow-up-from-line → check",
    d: "“Upgrade available”, then a tick once it's downloaded and only needs a restart. Plain and familiar.",
    a: icon("info", "arrowUpLine"), r: icon("ok", "check") },
  { t: "Plus → Check", lu: "badge: plus → check",
    d: "The same + glyph as the usage-reset badge, so the app uses one badge language. But + already means “banked reset” elsewhere.",
    a: icon("info", "plus"), r: icon("ok", "check") },
  { t: "Arrow down → Check", lu: "badge: arrow-down → check",
    d: "A bare download arrow without the tray. Lighter than the tray glyph, but a little more abstract.",
    a: icon("info", "down"), r: icon("ok", "check") },
  { t: "Sparkle → Check", lu: "badge: sparkle (filled) → check",
    d: "Sparkle while it's new, then a tick when it's ready. The friendliest pair here.",
    a: icon("info", "star", true), r: icon("ok", "check") },
];
document.getElementById("place").innerHTML = [
  { t: "Top right", d: "The usual notification spot, and where the usage-reset badge sits. It reads as “new”, and the badge clears the top of the pill.", pos: "" },
  { t: "Bottom right", d: "Like a status overlay on the gear (macOS uses this for app and folder badges). It's calmer, reads as “state”, and sits closer to the baseline of the label.", pos: "br" },
].map((o) => `<div class="opt"><h2>${o.t}</h2><p>${o.d}</p><div class="lu">Download → Restart</div>
  <div class="states">${state("Update available", icon("info", "tray", false, o.pos))}${state("Downloaded · restart", icon("ok", "rotate", false, o.pos))}</div></div>`).join("");
document.getElementById("grid").innerHTML = opts.map((o) => `<div class="opt">
  <h2>${o.t}${o.rec ? '<span class="rec">Recommended</span>' : ""}</h2>
  <p>${o.d}</p><div class="lu">${o.lu}</div>
  <div class="states">${state("Update available", o.a)}${state("Downloaded · restart", o.r)}</div></div>`).join("");
</script>
</body>
</html>
